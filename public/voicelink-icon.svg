<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 64 64" style="enable-background:new 0 0 64 64;" xml:space="preserve">
<defs>
  <!-- Blue → purple gradient (135°) matching the uploaded app icon -->
  <linearGradient id="vl-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4F6EF7"/>
    <stop offset="100%" stop-color="#7B61FF"/>
  </linearGradient>
  <!-- Soft white glow behind the microphone -->
  <filter id="vl-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <!-- Clip to circle -->
  <clipPath id="vl-clip">
    <circle cx="32" cy="32" r="30"/>
  </clipPath>
</defs>

<!-- Circular icon background with gradient -->
<circle cx="32" cy="32" r="30" fill="url(#vl-grad)"/>

<!-- Subtle inner highlight for depth -->
<circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

<!-- White minimalist microphone, centered with glow -->
<g clip-path="url(#vl-clip)" filter="url(#vl-glow)" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="3.4">
  <!-- Head (pill capsule) -->
  <rect x="25.5" y="15" width="13" height="22" rx="6.5" fill="#ffffff" stroke="none"/>
  <!-- U-curve (body) -->
  <path d="M 19 30 V 32 a 13 13 0 0 0 26 0 V 30"/>
  <!-- Stem -->
  <line x1="32" y1="45" x2="32" y2="52"/>
  <!-- Base -->
  <line x1="25" y1="52" x2="39" y2="52"/>
</g>
</svg>
